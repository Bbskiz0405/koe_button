<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>心咲koe哈欠按鈕</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1e1e3f, #2a2a6f);
      color: #fff;
    }

    /* ===== Header ===== */
    .main-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 60px;
      background: rgba(0, 0, 50, 0.4);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 1001;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .site-title {
      font-size: 20px;
      margin: 0;
      color: #fff;
      background: linear-gradient(to right, #a18cd1, #fbc2eb);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .menu-toggle {
      font-size: 24px;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 8px;
      transition: 0.3s;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
      color: #fff;
    }

    .menu-toggle:hover {
      background: rgba(255,255,255,0.2);
    }

    /* ===== Side Menu ===== */
    .side-menu {
      position: fixed;
      top: 60px;
      right: -260px;
      width: 240px;
      height: calc(100% - 60px);
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      color: white;
      padding: 30px 20px;
      box-shadow: -2px 0 12px rgba(0,0,0,0.3);
      transition: right 0.3s ease;
      z-index: 1000;
    }

    .side-menu.active {
      right: 0;
    }

    .side-menu h2 {
      margin-top: 0;
      font-size: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.3);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .side-menu ul {
      list-style: none;
      padding: 0;
    }

    .side-menu li {
      margin: 15px 0;
    }

    .side-menu a {
      color: #ffffff;
      text-decoration: none;
      transition: 0.2s;
    }

    .side-menu a:hover {
      color: #b4a2ff;
    }

    /* ===== Main Card ===== */
    .main-card {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 40px 32px;
      margin: 100px auto 40px auto;
      width: 90%;
      max-width: 800px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: center;
    }

    .button-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px 24px;
    }

    .yawn-button {
      backdrop-filter: blur(8px);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 14px 20px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      min-width: 100px;
      box-shadow: inset 0 0 0 rgba(0,0,0,0);
    }

    .yawn-button:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
    }

    .yawn-button:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="main-header">
    <h1 class="site-title">心咲koe哈欠按鈕</h1>
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>
  </header>

  <!-- 側邊選單 -->
  <div id="sideMenu" class="side-menu">
    <h2>選單</h2>
    <ul>
      <li><a href="#">關於本站</a></li>
      <li><a href="#">更多音效</a></li>
      <li><a href="#">聯絡我們</a></li>
    </ul>
  </div>

  <!-- 主卡片 -->
  <div class="main-card">
    <div class="button-container">
      <button class="yawn-button" onclick="playSound('yawn1')">哈欠1</button>
      <button class="yawn-button" onclick="playSound('yawn2')">哈欠2</button>
      <button class="yawn-button" onclick="playSound('yawn3')">哈欠3</button>
      <button class="yawn-button" onclick="playSound('yawn4')">哈欠4</button>
      <button class="yawn-button" onclick="playSound('yawn5')">哈欠5</button>
      <button class="yawn-button" onclick="playSound('yawn6')">哈欠6</button>
      <button class="yawn-button" onclick="playSound('yawn7')">哈欠7</button>
      <button class="yawn-button" onclick="playSound('yawn8')">哈欠8</button>
    </div>
  </div>

  <!-- Script -->
  <script>
    function playSound(soundName) {
      const sounds = {
        yawn1: 'sounds/yawn1.mp3',
        yawn2: 'sounds/yawn2.mp3',
        yawn3: 'sounds/yawn3.mp3',
        yawn4: 'sounds/yawn4.mp3',
        yawn5: 'sounds/yawn5.mp3',
        yawn6: 'sounds/yawn6.mp3',
        yawn7: 'sounds/yawn7.mp3',
        yawn8: 'sounds/yawn8.mp3'
      };
      const audio = new Audio(sounds[soundName]);
      audio.play();
    }

    function toggleMenu() {
      const menu = document.getElementById("sideMenu");
      menu.classList.toggle("active");

      if (menu.classList.contains("active")) {
        setTimeout(() => {
          document.addEventListener("click", handleOutsideClick);
        }, 10);
      } else {
        document.removeEventListener("click", handleOutsideClick);
      }
    }

    function handleOutsideClick(e) {
      const menu = document.getElementById("sideMenu");
      const toggle = document.querySelector(".menu-toggle");

      if (!menu.contains(e.target) && !toggle.contains(e.target)) {
        menu.classList.remove("active");
        document.removeEventListener("click", handleOutsideClick);
      }
    }
  </script>
</body>
</html>
